# Release of the VS Code extension with the engine bundled, per platform. Manual only:
# Actions → Release → Run workflow, with the new version (`dry_run`: everything but the Release). Tests run first (as in ci.yml);
# then one `rowan` binary per target is built, packed into a platform-specific .vsix
# (`vsce package --target`), everything is attached to a GitHub Release `v<version>`, and the
# five .vsix files are published to the Visual Studio Marketplace (`vsce publish --azure-credential`).
#
# Marketplace sign-in is a Microsoft Entra ID identity through workload identity federation (no
# token stored: GitHub's OIDC token is exchanged for an Azure one at run time; Azure DevOps global
# PATs are retired on 2026-12-01). One-time setup:
#   1. Entra admin center → App registrations → New (any name, e.g. rowan-marketplace; an Azure
#      subscription is not needed). Note its Application (client) ID and Directory (tenant) ID.
#   2. Its Certificates & secrets → Federated credentials → Add → "GitHub Actions deploying Azure
#      resources": organization kaidaniel, repository rowan, entity type Environment, name
#      `marketplace` (so the subject is `repo:kaidaniel/rowan:environment:marketplace`).
#   3. GitHub → Settings → Environments → New environment `marketplace` (no protection rules needed);
#      Settings → Secrets and variables → Actions → Variables: AZURE_CLIENT_ID, AZURE_TENANT_ID
#      (identifiers, not secrets).
#   4. Actions → "Marketplace identity" → Run workflow: it prints the identity's Azure DevOps
#      profile id. At https://marketplace.visualstudio.com/manage/publishers/rowan → Members → Add,
#      enter that id with the Contributor role.
# The sign-in is verified before anything is built, so a broken setup fails the run in seconds.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Extension version, new and semver (e.g. 0.1.1)"
        required: true
        type: string
      dry_run:
        description: "Build and test every package, but make no GitHub Release"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  UV_PYTHON_PREFERENCE: managed
  VERSION: ${{ inputs.version }}

jobs:
  check:
    name: check the version
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Semver, and no release of it yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.2.3, got '$VERSION'"; exit 1
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release v$VERSION exists already"; exit 1
          fi

      - uses: azure/login@v3
        if: ${{ !inputs.dry_run }}
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - uses: actions/setup-node@v7
        if: ${{ !inputs.dry_run }}
        with:
          node-version: 22

      - name: The identity may publish for the Rowan publisher
        if: ${{ !inputs.dry_run }}
        run: npx --yes @vscode/vsce verify-pat --azure-credential Rowan

  test:
    name: test (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rowan

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-dependency-glob: .python-version

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build (release)
        working-directory: rowan
        run: cargo build --release --locked

      - name: Unit tests
        working-directory: rowan
        run: cargo test --release --lib --locked

      - name: Golden suites
        run: uv run --no-project python tests/run_golden.py

      - name: Snapshots
        run: uv run --no-project python tests/run_snapshots.py

      - name: Extension hover rendering
        working-directory: vscode-rowan
        run: node test.js

  build:
    name: build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # macOS: native arm64, x64 cross-compiled on the same runner
          - { target: darwin-arm64, os: macos-latest, rust: aarch64-apple-darwin, zig: false, run: true }
          - { target: darwin-x64, os: macos-latest, rust: x86_64-apple-darwin, zig: false, run: false }
          # Linux: linked against glibc 2.17 with cargo-zigbuild, so the binary runs on any
          # distribution from the last decade (Ubuntu 18.04+, RHEL / Rocky 8+, Debian 10+)
          - { target: linux-x64, os: ubuntu-latest, rust: x86_64-unknown-linux-gnu, zig: true, run: true }
          - { target: linux-arm64, os: ubuntu-latest, rust: aarch64-unknown-linux-gnu, zig: true, run: false }
          # Windows: native x64 (MSVC); the engine is bin/rowan.exe
          - { target: win32-x64, os: windows-latest, rust: x86_64-pc-windows-msvc, zig: false, run: true, exe: .exe }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rowan
          key: ${{ matrix.rust }}

      - uses: astral-sh/setup-uv@v10.3.0
        if: matrix.zig

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build (cargo-zigbuild, glibc 2.17)
        if: matrix.zig
        working-directory: rowan
        run: |
          # cargo-zigbuild finds zig as `python3 -m ziglang`: a venv first on PATH holds both
          uv venv "$RUNNER_TEMP/zig"
          uv pip install --python "$RUNNER_TEMP/zig" cargo-zigbuild
          export PATH="$RUNNER_TEMP/zig/bin:$PATH"
          cargo zigbuild --release --locked --target ${{ matrix.rust }}.2.17

      - name: Build
        if: ${{ !matrix.zig }}
        working-directory: rowan
        run: cargo build --release --locked --target ${{ matrix.rust }}

      - name: Put the binary into the extension
        run: |
          mkdir -p vscode-rowan/bin
          cp rowan/target/${{ matrix.rust }}/release/rowan${{ matrix.exe }} vscode-rowan/bin/rowan${{ matrix.exe }}
          chmod 755 vscode-rowan/bin/rowan${{ matrix.exe }}
          cp rowan/target/${{ matrix.rust }}/release/rowan${{ matrix.exe }} rowan-${{ matrix.target }}${{ matrix.exe }}

      - name: Smoke test (native targets)
        if: matrix.run
        run: |
          printf 'd = {"a": 1}\nx = d["b"]\n' > smoke.py
          vscode-rowan/bin/rowan${{ matrix.exe }} smoke.py | tee smoke.out
          grep -q 'key "b" is never set$' smoke.out

      - name: Package the .vsix
        working-directory: vscode-rowan
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npx --yes @vscode/vsce package --no-dependencies --target ${{ matrix.target }} \
            --out "../rowan-${{ matrix.target }}-$VERSION.vsix"

      # (every target: unpacked and its engine's format checked; native targets also start
      # `rowan serve` through the extension's own code and check hovers)
      - name: Test the packaged extension
        run: node vscode-rowan/test_package.js "rowan-${{ matrix.target }}-$VERSION.vsix" ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            rowan-${{ matrix.target }}-${{ inputs.version }}.vsix
            rowan-${{ matrix.target }}${{ matrix.exe }}
          retention-days: 7

  release:
    name: GitHub Release
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "rowan $VERSION" \
            --notes "VS Code extension with the rowan engine bundled, one .vsix per platform (darwin-arm64, darwin-x64, linux-x64, linux-arm64, win32-x64), and the bare \`rowan\` binaries.

          **Marketplace:** https://marketplace.visualstudio.com/items?itemName=Rowan.rowan (published by this run; it may take a few minutes to show).
          **Manual install:** \`code --install-extension rowan-<platform>-$VERSION.vsix\`."

  publish:
    name: Marketplace
    needs: release
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # One call for all five: each .vsix carries its own --target, and they share the version.
      # If this fails after the Release exists, fix the cause and "Re-run failed jobs".
      - name: Publish the .vsix files
        run: |
          ls -l dist/*.vsix
          npx --yes @vscode/vsce publish --azure-credential --packagePath dist/*.vsix
