# One-off helper for the Marketplace sign-in that release.yml uses (see its header): signs in as
# the Entra ID identity and prints its Azure DevOps profile id, which is what the Marketplace's
# publisher page needs to make the identity a Contributor. The id can only be read while signed
# in as the identity, hence a workflow. Run it after setting the AZURE_* variables, and again
# after adding the member: its last step checks that the identity may publish.
name: Marketplace identity

on:
  workflow_dispatch:

jobs:
  profile:
    name: the identity's profile id
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # 499b84ac-… is the Azure DevOps resource id: the token is for Azure DevOps, not Azure.
      # An app registration has no Azure DevOps profile until it is added to an organization
      # (VSS011031 from profiles/me), but connectionData returns its identity either way.
      - name: Profile id
        run: |
          res=499b84ac-1321-427f-aa17-267ca6975798
          az rest --url https://app.vssps.visualstudio.com/_apis/connectionData --resource $res \
                  --query authenticatedUser --output json | tee user.json
          id=$(jq -r .id user.json)
          echo "::notice::Marketplace member id for the Rowan publisher (Contributor): $id"
          echo "profile (if any):"
          az rest --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource $res || true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Fails until the id above is a Contributor of the publisher; green means a release can publish.
      - name: The identity may publish for the Rowan publisher
        run: npx --yes @vscode/vsce verify-pat --azure-credential Rowan
