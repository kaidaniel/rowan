# CI for rowan: the Rust engine, its golden / snapshot / oracle suites, and the VS Code extension.
# The commit rule in AGENTS.md (golden, snapshots and `cargo test` must pass) is the `test` job,
# with the fuzzer and the on-demand check; `clippy`, the runtime oracle and the torch oracle run
# beside it (the oracles on its binary).
name: CI

on:
  push:
    branches: [main, rust-port]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Python runs only through uv (AGENTS.md); `.python-version` pins 3.14
  UV_PYTHON_PREFERENCE: managed

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rowan

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-dependency-glob: .python-version

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build (release)
        working-directory: rowan
        run: cargo build --release --locked

      - name: Unit tests
        working-directory: rowan
        run: cargo test --release --lib --locked

      - name: Golden suites
        run: uv run --no-project python tests/run_golden.py

      - name: Pending cases still pending
        # (informational: cases in tests/*/PENDING may fail; the harness reports them)
        continue-on-error: true
        run: uv run --no-project python tests/run_golden.py --pending

      - name: Snapshots
        run: uv run --no-project python tests/run_snapshots.py

      - name: Fuzzer, fixed seed (random programs vs CPython, also at budget=0)
        run: uv run --no-project python tests/fuzz.py -n 50 --seed 1 --shrink --out fuzz-fixed

      - name: Try routing (bounded try / except / finally programs vs CPython)
        # fails when rowan's claims miss a CPython run (tests/try_protocol.py; about 15 s)
        run: uv run --no-project python tests/try_protocol.py --rowan 2000

      - name: Generators (bounded generator / consumer programs vs CPython)
        # fails when rowan's claims miss a CPython run (tests/gen_protocol.py; about 10 s)
        run: uv run --no-project python tests/gen_protocol.py --rowan 2000

      - name: With statements (bounded with / __exit__ / contextmanager programs vs CPython)
        # fails when rowan's claims miss a CPython run (tests/with_protocol.py; about 10 s)
        run: uv run --no-project python tests/with_protocol.py --rowan 2000

      - name: Iterators and aliasing (bounded one-shot / live iterator programs vs CPython)
        # fails when rowan's claims miss a CPython run (tests/iter_protocol.py; about 10 s)
        run: uv run --no-project python tests/iter_protocol.py --rowan 2000

      - name: Calls and skipped calls (bounded callee / call-shape programs vs CPython, at three budgets)
        # fails when rowan's claims miss a CPython run (tests/call_protocol.py; about 30 s)
        run: uv run --no-project python tests/call_protocol.py --rowan 2000

      - name: Recursion (bounded recursive function programs vs CPython, at three budgets)
        # fails when rowan's claims miss a CPython run (tests/rec_protocol.py; about 20 s)
        run: uv run --no-project python tests/rec_protocol.py --rowan 1500

      - name: Methods as callees (bounded method / property / __init__ programs vs CPython, at three budgets)
        # fails when rowan's claims miss a CPython run (tests/method_protocol.py; about 25 s)
        run: uv run --no-project python tests/method_protocol.py --rowan 1500

      - name: Closures and nonlocal (bounded closure programs vs CPython, at three budgets)
        # fails when rowan's claims miss a CPython run (tests/closure_protocol.py; about 20 s)
        run: uv run --no-project python tests/closure_protocol.py --rowan 2000

      - name: Narrowing and match (bounded test / pattern programs vs CPython)
        # fails when rowan's claims miss a CPython run (tests/narrow_protocol.py; about 20 s)
        run: uv run --no-project python tests/narrow_protocol.py --rowan 5000

      - name: The data model (bounded dunder / builtin programs vs CPython, at two budgets)
        # fails when rowan's claims miss a CPython run (tests/dunder_protocol.py; about 10 s)
        run: uv run --no-project python tests/dunder_protocol.py --all

      - name: Runs for any call (bounded operations on parameters vs CPython, at two budgets)
        # fails when rowan's claims miss a CPython run (tests/anycall_protocol.py; about 30 s)
        run: uv run --no-project python tests/anycall_protocol.py --rowan 3000

      - name: The str model and formatting (bounded str methods, %, format specs vs CPython)
        # fails when rowan's claims miss a CPython run (tests/str_protocol.py; about 15 s)
        run: uv run --no-project python tests/str_protocol.py --all

      - name: Library models (bounded json, re, datetime, decimal, csv calls vs CPython)
        # fails when rowan's claims miss a CPython run (tests/lib_protocol.py; about 5 s)
        run: uv run --no-project python tests/lib_protocol.py --all

      - name: Container models (bounded list, dict, set, tuple operations vs CPython)
        # fails when rowan's claims miss a CPython run (tests/container_protocol.py; about 5 s)
        run: uv run --no-project python tests/container_protocol.py --all

      - name: Loops (bounded for / while loops × bodies × forms vs CPython)
        # fails when rowan's claims miss a CPython run (tests/loop_protocol.py; about 15 s)
        run: uv run --no-project python tests/loop_protocol.py --all

      - name: Classes (bounded inheritance shapes × receivers × operations vs CPython)
        # fails when rowan's claims miss a CPython run (tests/class_protocol.py; about 10 s)
        run: uv run --no-project python tests/class_protocol.py --all

      - name: collections models (bounded Counter, defaultdict, OrderedDict, deque, namedtuple calls vs CPython)
        # fails when rowan's claims miss a CPython run (tests/collections_protocol.py; about 5 s)
        run: uv run --no-project python tests/collections_protocol.py --all

      - name: itertools model (bounded itertools calls vs CPython)
        # fails when rowan's claims miss a CPython run (tests/itertools_protocol.py; about 3 s)
        run: uv run --no-project python tests/itertools_protocol.py --all

      - name: sqlite3 model (bounded queries on in-memory tables vs CPython)
        # fails when rowan's claims miss a CPython run (tests/sqlite_protocol.py; about 3 s)
        run: uv run --no-project python tests/sqlite_protocol.py --all

      - name: configparser model (bounded INI reads vs CPython)
        # fails when rowan's claims miss a CPython run (tests/config_protocol.py; about 3 s)
        run: uv run --no-project python tests/config_protocol.py --all

      - name: argparse model (bounded parsers x argvs vs CPython)
        # fails when rowan's claims miss a CPython run (tests/argparse_protocol.py; about 5 s)
        run: uv run --no-project python tests/argparse_protocol.py --all

      - name: pure paths (bounded PurePosixPath / os.path operations vs CPython)
        # fails when rowan's claims miss a CPython run (tests/pathlib_protocol.py; about 3 s)
        run: uv run --no-project python tests/pathlib_protocol.py --all

      - name: Coroutines, tasks, async generators, async with / for (bounded programs vs CPython, at two budgets)
        # fails when rowan's claims miss a CPython run (tests/async_protocol.py; about 6 s)
        run: uv run --no-project python tests/async_protocol.py --all

      - name: Descriptors (data, non-data, __set_name__, cached_property, slots vs CPython, at two budgets)
        # fails when rowan's claims miss a CPython run (tests/descriptor_protocol.py; about 9 s)
        run: uv run --no-project python tests/descriptor_protocol.py --all

      - name: Deferred definitions (bounded decorated defs in imported modules vs CPython, at two budgets)
        # fails when rowan's claims miss a CPython run (tests/deferred_protocol.py; about 25 s)
        run: uv run --no-project python tests/deferred_protocol.py --rowan 2000

      - name: csv model (bounded readers / writers with dialects, quoting, dict readers / writers vs CPython)
        # fails when rowan's claims miss a CPython run (tests/csv_protocol.py; about 6 s)
        run: uv run --no-project python tests/csv_protocol.py --all

      - name: Narrowing, pairs (two tests on one value vs CPython)
        # fails when rowan's claims miss a CPython run (tests/narrow_protocol.py --pairs; about 20 s)
        run: uv run --no-project python tests/narrow_protocol.py --pairs --rowan 5000

      - name: The data model, pairs (two operations on the same instances vs CPython, at two budgets)
        # fails when rowan's claims miss a CPython run (tests/dunder_protocol.py --pairs; about 25 s)
        run: uv run --no-project python tests/dunder_protocol.py --pairs --rowan 2500

      - name: Classes, pairs (a change then an operation vs CPython, at two budgets)
        # fails when rowan's claims miss a CPython run (tests/class_protocol.py --pairs; about 25 s)
        run: uv run --no-project python tests/class_protocol.py --pairs --rowan 2500

      - name: Container models, pairs (a mutation then an operation vs CPython)
        # fails when rowan's claims miss a CPython run (tests/container_protocol.py --pairs; about 15 s)
        run: uv run --no-project python tests/container_protocol.py --pairs --rowan 4000

      - name: Calls, pairs (two callees on shared values vs CPython, at three budgets)
        # fails when rowan's claims miss a CPython run (tests/call_protocol.py --pairs; about 25 s)
        run: uv run --no-project python tests/call_protocol.py --pairs --rowan 1500

      - name: Calls that do not run (callees whose own callees observe, called twice, vs CPython, at three budgets)
        # fails when rowan's claims miss a CPython run (tests/call_protocol.py --unrun --all; about 40 s)
        run: uv run --no-project python tests/call_protocol.py --unrun --all

      - name: Metamorphic checks (rowan against itself, quick bound)
        # fails when a changed program's claims miss the original's (tests/metamorphic.py --quick)
        run: uv run --no-project python tests/metamorphic.py --quick

      - name: Fuzzer, a new seed per run (informational)
        id: fuzz-rotating
        # different programs each run; a failure here is a real unsoundness, but one the change
        # under test may not have caused, so it reports without failing the job. Repro:
        # `tests/fuzz.py -n 50 --seed <the printed seed> --shrink`
        continue-on-error: true
        run: |
          seed=$(( ${{ github.run_number }} * 1000 + ${{ github.run_attempt }} ))
          echo "fuzz seed: $seed"
          uv run --no-project python tests/fuzz.py -n 50 --seed "$seed" --shrink --out fuzz-rotating \
            || { echo "::warning title=fuzz::unsound programs at seed $seed (tests/fuzz.py -n 50 --seed $seed --shrink)"; exit 1; }

      - name: Fuzzer failures
        if: failure() || steps.fuzz-rotating.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.os }}
          path: fuzz-*/
          retention-days: 7

      - name: On demand vs the whole program (golden cases)
        run: uv run --no-project python tests/ondemand_check.py -j 4

      - name: Extension hover rendering
        working-directory: vscode-rowan
        run: node test.js

      - name: Upload the binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os == 'ubuntu-latest' && 'rowan-linux' || 'rowan-macos' }}
          path: rowan/target/release/rowan
          retention-days: 7

  clippy:
    # correctness lints only (deny): the other groups are style, left to the owner
    name: clippy (correctness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rowan
          key: clippy

      - name: cargo clippy
        working-directory: rowan
        run: cargo clippy --release --locked --all-targets -- -D clippy::correctness

  vsix:
    # The platform-specific .vsix as a user installs it (v0.1.8 shipped a Linux engine to
    # macOS: `spawn ENOEXEC`): packed per native target, unpacked, the engine's format checked
    # against the target, `rowan serve` started through the extension's own code, hovers
    # checked (vscode-rowan/test_package.js). Windows builds its engine here.
    name: vsix ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-latest, binary: rowan-linux }
          - { target: darwin-arm64, os: macos-latest, binary: rowan-macos }
          - { target: win32-x64, os: windows-latest, binary: "" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download the engine
        if: matrix.binary
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.binary }}
          path: vscode-rowan/bin

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.binary }}

      - uses: Swatinem/rust-cache@v2
        if: ${{ !matrix.binary }}
        with:
          workspaces: rowan

      - name: Build the engine (Windows)
        if: ${{ !matrix.binary }}
        working-directory: rowan
        run: |
          cargo build --release --locked
          mkdir -p ../vscode-rowan/bin
          cp target/release/rowan.exe ../vscode-rowan/bin/rowan.exe

      - name: Package the .vsix
        working-directory: vscode-rowan
        run: npx --yes @vscode/vsce package --no-dependencies --target ${{ matrix.target }} --out ../rowan-${{ matrix.target }}.vsix

      - name: Unpack, check the engine's format, start it through the extension, hovers
        run: node vscode-rowan/test_package.js rowan-${{ matrix.target }}.vsix ${{ matrix.target }}

  oracle:
    name: runtime oracle
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-dependency-glob: .python-version

      - name: Download the binary
        uses: actions/download-artifact@v8
        with:
          name: rowan-linux
          path: rowan/target/release

      - run: chmod +x rowan/target/release/rowan

      - name: Expectations against real pandas / pydantic / FastAPI / numpy
        run: >
          uv run --no-project
          --with pandas --with pydantic --with pydantic-settings --with fastapi --with httpx --with numpy
          python tests/oracle.py

      - name: pandas model (bounded frame operations vs real pandas)
        # fails when rowan's claims miss a run (tests/pandas_protocol.py; about 25 s)
        run: uv run --no-project --with pandas python tests/pandas_protocol.py --all

      - name: pydantic model (bounded model validations vs real pydantic)
        # fails when rowan's claims miss a run (tests/pydantic_protocol.py; about 30 s)
        run: uv run --no-project --with pydantic python tests/pydantic_protocol.py --all

  torch-oracle:
    name: torch oracle
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-dependency-glob: .python-version

      - name: Download the binary
        uses: actions/download-artifact@v8
        with:
          name: rowan-linux
          path: rowan/target/release

      - run: chmod +x rowan/target/release/rowan

      - name: Tensor-shape expectations against real PyTorch (CPU wheels)
        env:
          UV_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: uv run --no-project --with torch --with numpy python tests/torch_oracle.py

      - name: Tensor shapes (bounded torch / numpy operations vs real torch and numpy)
        # fails when rowan's claims miss a run (tests/tensor_protocol.py; about 10 s)
        env:
          UV_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: uv run --no-project --with torch --with numpy python tests/tensor_protocol.py --all

  package:
    name: package the VS Code extension
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build the .vsix
        working-directory: vscode-rowan
        run: npx --yes @vscode/vsce package --no-dependencies

      - uses: actions/upload-artifact@v7
        with:
          name: rowan-vsix
          path: vscode-rowan/*.vsix
