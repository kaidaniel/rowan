# CI for rowan: the Rust engine, its golden / snapshot / oracle suites, and the VS Code extension.
# The commit rule in AGENTS.md (golden, snapshots and `cargo test` must pass) is the `test` job,
# with the fuzzer and the on-demand check; `clippy`, the runtime oracle and the torch oracle run
# beside it (the oracles on its binary).
name: CI

on:
  push:
    branches: [main, rust-port]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Python runs only through uv (AGENTS.md); `.python-version` pins 3.14
  UV_PYTHON_PREFERENCE: managed

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rowan

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-dependency-glob: .python-version

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build (release)
        working-directory: rowan
        run: cargo build --release --locked

      - name: Unit tests
        working-directory: rowan
        run: cargo test --release --lib --locked

      - name: Golden suites
        run: uv run --no-project python tests/run_golden.py

      - name: Pending cases still pending
        # (informational: cases in tests/*/PENDING may fail; the harness reports them)
        continue-on-error: true
        run: uv run --no-project python tests/run_golden.py --pending

      - name: Snapshots
        run: uv run --no-project python tests/run_snapshots.py

      - name: Fuzzer, fixed seed (random programs vs CPython, also at budget=0)
        run: uv run --no-project python tests/fuzz.py -n 50 --seed 1 --shrink --out fuzz-fixed

      - name: Try routing (bounded try / except / finally programs vs CPython)
        # fails when rowan's claims miss a CPython run (tests/try_protocol.py; about 15 s)
        run: uv run --no-project python tests/try_protocol.py --rowan 2000

      - name: Fuzzer, a new seed per run (informational)
        id: fuzz-rotating
        # different programs each run; a failure here is a real unsoundness, but one the change
        # under test may not have caused, so it reports without failing the job. Repro:
        # `tests/fuzz.py -n 50 --seed <the printed seed> --shrink`
        continue-on-error: true
        run: |
          seed=$(( ${{ github.run_number }} * 1000 + ${{ github.run_attempt }} ))
          echo "fuzz seed: $seed"
          uv run --no-project python tests/fuzz.py -n 50 --seed "$seed" --shrink --out fuzz-rotating \
            || { echo "::warning title=fuzz::unsound programs at seed $seed (tests/fuzz.py -n 50 --seed $seed --shrink)"; exit 1; }

      - name: Fuzzer failures
        if: failure() || steps.fuzz-rotating.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.os }}
          path: fuzz-*/
          retention-days: 7

      - name: On demand vs the whole program (golden cases)
        run: uv run --no-project python tests/ondemand_check.py -j 4

      - name: Extension hover rendering
        working-directory: vscode-rowan
        run: node test.js

      - name: Upload the binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os == 'ubuntu-latest' && 'rowan-linux' || 'rowan-macos' }}
          path: rowan/target/release/rowan
          retention-days: 7

  clippy:
    # correctness lints only (deny): the other groups are style, left to the owner
    name: clippy (correctness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rowan
          key: clippy

      - name: cargo clippy
        working-directory: rowan
        run: cargo clippy --release --locked --all-targets -- -D clippy::correctness

  vsix:
    # The platform-specific .vsix as a user installs it (v0.1.8 shipped a Linux engine to
    # macOS: `spawn ENOEXEC`): packed per native target, unpacked, the engine's format checked
    # against the target, `rowan serve` started through the extension's own code, hovers
    # checked (vscode-rowan/test_package.js). Windows builds its engine here.
    name: vsix ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-latest, binary: rowan-linux }
          - { target: darwin-arm64, os: macos-latest, binary: rowan-macos }
          - { target: win32-x64, os: windows-latest, binary: "" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download the engine
        if: matrix.binary
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.binary }}
          path: vscode-rowan/bin

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.binary }}

      - uses: Swatinem/rust-cache@v2
        if: ${{ !matrix.binary }}
        with:
          workspaces: rowan

      - name: Build the engine (Windows)
        if: ${{ !matrix.binary }}
        working-directory: rowan
        run: |
          cargo build --release --locked
          mkdir -p ../vscode-rowan/bin
          cp target/release/rowan.exe ../vscode-rowan/bin/rowan.exe

      - name: Package the .vsix
        working-directory: vscode-rowan
        run: npx --yes @vscode/vsce package --no-dependencies --target ${{ matrix.target }} --out ../rowan-${{ matrix.target }}.vsix

      - name: Unpack, check the engine's format, start it through the extension, hovers
        run: node vscode-rowan/test_package.js rowan-${{ matrix.target }}.vsix ${{ matrix.target }}

  oracle:
    name: runtime oracle
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-dependency-glob: .python-version

      - name: Download the binary
        uses: actions/download-artifact@v8
        with:
          name: rowan-linux
          path: rowan/target/release

      - run: chmod +x rowan/target/release/rowan

      - name: Expectations against real pandas / pydantic / FastAPI / numpy
        run: >
          uv run --no-project
          --with pandas --with pydantic --with pydantic-settings --with fastapi --with httpx --with numpy
          python tests/oracle.py

  torch-oracle:
    name: torch oracle
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-dependency-glob: .python-version

      - name: Download the binary
        uses: actions/download-artifact@v8
        with:
          name: rowan-linux
          path: rowan/target/release

      - run: chmod +x rowan/target/release/rowan

      - name: Tensor-shape expectations against real PyTorch (CPU wheels)
        env:
          UV_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: uv run --no-project --with torch --with numpy python tests/torch_oracle.py

  package:
    name: package the VS Code extension
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build the .vsix
        working-directory: vscode-rowan
        run: npx --yes @vscode/vsce package --no-dependencies

      - uses: actions/upload-artifact@v7
        with:
          name: rowan-vsix
          path: vscode-rowan/*.vsix
