# Benchmarks: rowan on large real programs (stdlib12k, email, rich, click; and the frontier of
# ~130k-350k-line packages: pip, timm, sktime, functional), without its deadlines, one job each in
# parallel, cut at 10 minutes; the on-demand hover timings (rich, pip) and the site-packages
# benchmark. Records wall time, peak memory, rowan's deterministic work
# counters and verdict counts, plus a `perf` profile (top functions in the job summary, a
# flamegraph as an artifact). Informational only: every job has continue-on-error, and this
# workflow must not be a required status check, so it never blocks a merge.
name: Bench

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # on main every commit gets its own run (and its numbers); on a PR a newer push supersedes
  group: bench-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  UV_PYTHON_PREFERENCE: managed

jobs:
  build:
    name: build (frame pointers)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rowan
          key: bench-fp

      - name: Build (release, with frame pointers for perf's call stacks)
        working-directory: rowan
        env:
          RUSTFLAGS: -C force-frame-pointers=yes
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v7
        with:
          name: bench-rowan
          path: rowan/target/release/rowan
          retention-days: 3

  bench:
    name: bench ${{ matrix.program }}
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        program: [stdlib12k, email, rich, click, pip, timm, sktime, functional]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-dependency-glob: .python-version

      - uses: actions/download-artifact@v8
        with:
          name: bench-rowan
          path: bin

      - run: chmod +x bin/rowan

      - name: Prepare the program
        id: prep
        run: echo "file=$(uv run --no-project python bench/prepare.py ${{ matrix.program }})" >> "$GITHUB_OUTPUT"

      - name: Install perf and inferno (profiling is optional)
        id: perf
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-tools-common "linux-tools-$(uname -r)" \
            || sudo apt-get install -y -qq linux-tools-common linux-tools-azure
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          perf --version
          cargo install inferno --locked --quiet
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Run (no deadlines, 10 minute timeout)
        run: |
          PERF=""
          if [ "${{ steps.perf.outputs.ok }}" = "true" ]; then PERF="--perf perf.data"; fi
          uv run --no-project python bench/run.py ${{ matrix.program }} bin/rowan \
            "${{ steps.prep.outputs.file }}" --timeout 600 --out results $PERF

      - name: Profile report
        if: steps.perf.outputs.ok == 'true'
        continue-on-error: true
        run: |
          perf report -i perf.data --stdio --no-children --sort symbol -g none --percent-limit 0.5 2>/dev/null \
            | grep -v '^#' | grep -v '^$' | head -40 > results/${{ matrix.program }}.profile.txt
          perf script -i perf.data 2>/dev/null | inferno-collapse-perf | inferno-flamegraph \
            --title "rowan: ${{ matrix.program }}" > results/${{ matrix.program }}.flamegraph.svg

      - name: Job summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.program }}"
            echo
            echo "| program | result | wall | peak memory | work | units | tabulations | objects | ✗/⚠ verdicts |"
            echo "| --- | --- | --- | --- | --- | --- | --- | --- | --- |"
            cat results/${{ matrix.program }}.md 2>/dev/null || echo "| ${{ matrix.program }} | no result | | | | | | | |"
            if [ -s results/${{ matrix.program }}.profile.txt ]; then
              echo
              echo "Top functions by self time (perf, frame-pointer stacks; flamegraph in the artifact):"
              echo
              echo '```'
              cat results/${{ matrix.program }}.profile.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          gzip -f results/*.err 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-${{ matrix.program }}
          path: results/
          retention-days: 30

  # Time to information on demand (the editor's hovers): every function of the program run
  # alone after the setup (bench/hovers.py: `rowan hovers`, 4 processes), and `rowan serve`'s
  # time to the first hover in 12 of its files (bench/first_hover.py). rich: a small program;
  # pip: a large one (timm takes ~4 minutes of hovers).
  hovers:
    name: hovers ${{ matrix.program }}
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        program: [rich, pip]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-dependency-glob: .python-version

      - uses: actions/download-artifact@v8
        with:
          name: bench-rowan
          path: bin

      - run: chmod +x bin/rowan

      - name: Prepare the program
        run: uv run --no-project python bench/prepare.py ${{ matrix.program }}

      - name: Every function on demand
        run: uv run --no-project python bench/hovers.py bin/rowan ${{ matrix.program }} -j 4 --out results

      - name: Time to the first hover (rowan serve)
        if: always()
        run: uv run --no-project python bench/first_hover.py bin/rowan ${{ matrix.program }} --out results

      - name: Job summary
        if: always()
        run: |
          uv run --no-project python - ${{ matrix.program }} >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, sys
          from pathlib import Path
          name = sys.argv[1]
          print(f"### hovers: {name}\n")
          h = Path(f"results/{name}-hovers.json")
          if h.exists():
              s = json.loads(h.read_text())["summary"]
              print("| functions | setup | p50 | p95 | p99 | max | over 1 s | cut |")
              print("| --- | --- | --- | --- | --- | --- | --- | --- |")
              print(f"| {s['timed']} / {s['functions']} | {s['setup_ms']} ms | {s['p50']} ms | {s['p95']} ms | {s['p99']} ms | {s['max']} ms | {s['over_1s']} | {s['cut']} |")
          else:
              print("hovers.py: no result")
          f = Path(f"results/{name}-first.json")
          if f.exists():
              s = json.loads(f.read_text())["summary"]
              t = s["first_hover_ms"]
              print(f"\nFirst hover in a file (rowan serve, {s['modules']} files, {s['on_demand']} on demand): p50 {t['p50']} ms, p95 {t['p95']} ms, max {t['max']} ms; peak memory {s['peak_mb']} MB")
          else:
              print("\nfirst_hover.py: no result")
          EOF

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-hovers-${{ matrix.program }}
          path: results/
          retention-days: 30

  # What following installed packages costs and buys (bench/sitepackages.py: five pinned venvs,
  # `--follow` off / '*' / the company package alone; not the uncapped mode, which runs for
  # minutes). The venvs are cached by their pins and the local package.
  sitepackages:
    name: site-packages
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-dependency-glob: .python-version

      - uses: actions/download-artifact@v8
        with:
          name: bench-rowan
          path: bin

      - run: chmod +x bin/rowan

      - uses: actions/cache@v4
        with:
          path: bench/work/sitepackages
          key: sitepackages-${{ runner.os }}-${{ hashFiles('bench/sitepackages.py', 'bench/sitepackages/**', '.python-version') }}

      - name: Site-packages benchmark
        run: |
          mkdir -p results
          {
            echo "### site-packages (bench/sitepackages.py)"
            echo
            uv run --no-project python bench/sitepackages.py --rowan bin/rowan --out results/sitepackages.json
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-sitepackages
          path: results/
          retention-days: 30

  # Soundness without per-call-site runs: the golden suites with `tab=0` (main before the
  # summaries were removed: every call used its function's summary) and `budget=0` (every call
  # past its function's budget: an unknown call, and a reporting run with open parameters).
  # Informational: the step never fails the job.
  golden-fallback:
    name: golden (tab=0 / budget=0)
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-dependency-glob: .python-version

      - uses: actions/download-artifact@v8
        with:
          name: bench-rowan
          path: rowan/target/release

      - name: Golden suites, every call past its budget
        continue-on-error: true
        run: |
          chmod +x rowan/target/release/rowan
          mkdir -p results
          ROWAN_LIMITS=budget=0 uv run --no-project python tests/run_golden.py > golden.txt 2>&1 || true
          line=$(grep -E '^ *[0-9]+/[0-9]+ passed' golden.txt | tail -1)
          pass=$(echo "$line" | sed -E 's|^ *([0-9]+)/([0-9]+).*|\1|')
          total=$(echo "$line" | sed -E 's|^ *([0-9]+)/([0-9]+).*|\2|')
          echo "{\"name\": \"golden tab=0\", \"golden_passing\": ${pass:-0}, \"golden_failing\": $(( ${total:-0} - ${pass:-0} ))}" > results/golden-tab0.json
          {
            echo "### golden suites with ROWAN_LIMITS=budget=0 (informational)"
            echo
            echo "${line:-no result}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-golden
          path: results/
          retention-days: 30

  summary:
    name: summary
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bench-*
          path: results
          merge-multiple: true

      - name: One table for all programs
        run: |
          {
            echo "## rowan benchmarks (no deadlines, 10 minute timeout per program)"
            echo
            echo "| program | result | wall | peak memory | work | units | tabulations | objects | ✗/⚠ verdicts |"
            echo "| --- | --- | --- | --- | --- | --- | --- | --- | --- |"
            for p in stdlib12k email rich click pip timm sktime functional; do
              cat "results/$p.md" 2>/dev/null || echo "| $p | no result | | | | | | | |"
            done
            echo
            echo "Wall time and memory vary ±10–20% between runners; work, units, tabulations and objects are deterministic."
            echo "Per-program profiles: the bench jobs' summaries; flamegraphs: the bench-<program> artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

  # History across commits (main only): github-action-benchmark appends this run's numbers to
  # the data on the `gh-pages` branch (dev/bench/data.js, charts in dev/bench/index.html), and
  # the branch's contents are deployed to GitHub Pages (Settings → Pages → Source: GitHub
  # Actions): https://kaidaniel.github.io/rowan/dev/bench/
  history:
    name: history
    needs: [bench, golden-fallback, hovers, sitepackages]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    concurrency:
      # one writer of gh-pages at a time
      group: bench-history
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-dependency-glob: .python-version

      - uses: actions/download-artifact@v8
        with:
          pattern: bench-*
          path: results
          merge-multiple: true

      - name: Results as benchmark entries
        run: uv run --no-project python bench/history.py results bench-history.json

      - name: Append to the history on gh-pages
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: rowan
          tool: customSmallerIsBetter
          output-file-path: bench-history.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # informational: a regression shows in the charts and the job log, nothing fails
          alert-threshold: "130%"
          comment-on-alert: false
          fail-on-alert: false

      - name: The gh-pages contents
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: site

      - name: The overview page and the release scoreboard
        run: |
          cp site/dev/bench/index.html site/dev/bench/charts.html
          cp bench/site/index.html site/dev/bench/index.html
          cp bench/scoreboard.json site/dev/bench/scoreboard.json

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: publish to GitHub Pages
    needs: history
    if: always() && needs.history.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}dev/bench/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
