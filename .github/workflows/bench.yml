# Benchmarks: everything that measures rowan beyond ci.yml's blocking bounds, on every push and
# pull request, one runner per piece. Each job's time on GitHub's runners (PR #107, 2026-10-29):
#   tracked      the tracked set (bench/tracked.py: the eight benchmarks + the cost set's 23
#                modules) in both modes, the 10 s deadline and none, in 4 shards; `perf` profiles
#                of each program (top functions in the job summary, flamegraphs as artifacts):
#                4–7 min a shard (pyflakes' checker hits the 180 s cut with no deadline)
#   hovers       every function on demand (bench/hovers.py) and the first hover in a file
#                (bench/first_hover.py) for all eight benchmarks: 0.3 (stdlib12k) to 15 min
#                (functional; timm 11, sktime 8, pip 7)
#   sitepackages bench/sitepackages.py, capped (0.7 min) and --uncapped (21 min)
#   heldout      the held-out corpus's metrics (bench/heldout.py, default limits): 3 min
#   golden       the golden suites at budget=0: 0.5 min
#   protocols    every protocol enumerator ci.yml runs on a sample, on all its programs instead
#                (bench/protocols.py full: ~930k program runs, 5.1M points, in 4 jobs of 4
#                processes): 5–7.5 min a job
#   metamorphic  tests/metamorphic.py in full (ci.yml: every 40th case), 2 shards: under 30 s
#                each (red while it finds misses: an informational finding)
#   kani         the bounded proofs (cargo kani --lib): 1–1.5 min
# Not run here: `heldout.py sound` (heldout.yml, after every merge: 8–25 min), the scoreboard
# (bench/scoreboard.py: every release, hours; the owner's).
# Informational only: every job has continue-on-error, and this workflow must not be a required
# status check, so it never blocks a merge.
name: Bench

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # on main every commit gets its own run (and its numbers); on a PR a newer push supersedes
  group: bench-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  UV_PYTHON_PREFERENCE: managed

defaults:
  run:
    # (bash -eo pipefail: a harness piped into tee fails its step)
    shell: bash

jobs:
  build:
    name: build (frame pointers)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rowan
          key: bench-fp

      - name: Build (release, with frame pointers for perf's call stacks)
        working-directory: rowan
        env:
          RUSTFLAGS: -C force-frame-pointers=yes
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v7
        with:
          name: bench-rowan
          path: rowan/target/release/rowan
          retention-days: 3

  tracked:
    name: tracked ${{ matrix.shard }}/4
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-dependency-glob: .python-version

      - uses: actions/download-artifact@v8
        with:
          name: bench-rowan
          path: bin

      - run: chmod +x bin/rowan

      - uses: actions/cache@v4
        with:
          path: bench/work/costset/src
          key: costset-src-${{ hashFiles('bench/costset/manifest.json') }}

      - name: Install perf and inferno (profiling is optional)
        id: perf
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-tools-common "linux-tools-$(uname -r)" \
            || sudo apt-get install -y -qq linux-tools-common linux-tools-azure
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          perf --version
          cargo install inferno --locked --quiet
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: The shard's programs, 10 s deadline and none (then perf profiles)
        run: |
          PROFILE=""
          if [ "${{ steps.perf.outputs.ok }}" = "true" ]; then PROFILE="--profile results/profiles"; fi
          uv run --no-project python bench/tracked.py metrics --rowan bin/rowan --mode both \
            --shard ${{ matrix.shard }}/4 --json results/tracked-${{ matrix.shard }}.json $PROFILE

      - name: Job summary
        if: always()
        run: |
          {
            echo "### tracked set, shard ${{ matrix.shard }}/4 (bench/tracked.py)"
            echo
            uv run --no-project python bench/tracked.py table results/tracked-${{ matrix.shard }}.json --md || echo "no result"
            for f in results/profiles/*.profile.txt; do
              [ -s "$f" ] || continue
              echo
              echo "Top functions by self time, $(basename "$f" .profile.txt) (perf, frame-pointer stacks; flamegraph in the artifact):"
              echo
              echo '```'
              cat "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-tracked-${{ matrix.shard }}
          path: results/
          retention-days: 30

  # Time to information on demand (the editor's hovers): every function of the program run
  # alone after the setup (bench/hovers.py: `rowan hovers`, 4 processes), and `rowan serve`'s
  # time to the first hover in 12 of its files (bench/first_hover.py); all eight programs.
  hovers:
    name: hovers ${{ matrix.program }}
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        program: [stdlib12k, email, rich, click, pip, timm, sktime, functional]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-dependency-glob: .python-version

      - uses: actions/download-artifact@v8
        with:
          name: bench-rowan
          path: bin

      - run: chmod +x bin/rowan

      - name: Prepare the program
        run: uv run --no-project python bench/prepare.py ${{ matrix.program }}

      - name: Every function on demand
        run: uv run --no-project python bench/hovers.py bin/rowan ${{ matrix.program }} -j 4 --out results

      - name: Time to the first hover (rowan serve)
        if: always()
        run: uv run --no-project python bench/first_hover.py bin/rowan ${{ matrix.program }} --out results

      - name: Job summary
        if: always()
        run: |
          uv run --no-project python - ${{ matrix.program }} >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, sys
          from pathlib import Path
          name = sys.argv[1]
          print(f"### hovers: {name}\n")
          h = Path(f"results/{name}-hovers.json")
          if h.exists():
              s = json.loads(h.read_text())["summary"]
              print("| functions | setup | p50 | p95 | p99 | max | over 1 s | cut |")
              print("| --- | --- | --- | --- | --- | --- | --- | --- |")
              print(f"| {s['timed']} / {s['functions']} | {s['setup_ms']} ms | {s['p50']} ms | {s['p95']} ms | {s['p99']} ms | {s['max']} ms | {s['over_1s']} | {s['cut']} |")
          else:
              print("hovers.py: no result")
          f = Path(f"results/{name}-first.json")
          if f.exists():
              s = json.loads(f.read_text())["summary"]
              t = s["first_hover_ms"]
              print(f"\nFirst hover in a file (rowan serve, {s['modules']} files, {s['on_demand']} on demand): p50 {t['p50']} ms, p95 {t['p95']} ms, max {t['max']} ms; peak memory {s['peak_mb']} MB")
          else:
              print("\nfirst_hover.py: no result")
          EOF

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-hovers-${{ matrix.program }}
          path: results/
          retention-days: 30

  # The protocol enumerators beyond ci.yml's bounds: each step ci.yml runs on a sample
  # (`--rowan N`) on every program, in shards dealt to 4 jobs (bench/protocols.py full; 4
  # processes each, the runner's cores). A missed point fails the job (shown red; the workflow
  # stays informational): `bench/protocols.py full --only NAME` and the step's log reproduce it.
  protocols:
    name: protocols in full ${{ matrix.job }}/4
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        job: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-dependency-glob: .python-version

      - uses: actions/download-artifact@v8
        with:
          name: bench-rowan
          path: bin

      - run: chmod +x bin/rowan

      - name: The job's shards (bench/protocols.py full)
        run: |
          uv run --no-project python bench/protocols.py full --job ${{ matrix.job }}/4 -j 4 --rowan bin/rowan \
            --json results/protocols-${{ matrix.job }}.json --logs results/protocol-logs

      - name: Job summary
        if: always()
        run: |
          uv run --no-project python - ${{ matrix.job }} >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, sys
          from pathlib import Path
          f = Path(f"results/protocols-{sys.argv[1]}.json")
          print(f"### protocol enumerators in full, job {sys.argv[1]}/4\n")
          if not f.exists():
              print("no result")
              raise SystemExit
          d = json.loads(f.read_text())
          print("| step | programs | points | missed | crashed batches | seconds |")
          print("| --- | --- | --- | --- | --- | --- |")
          for s in d["steps"]:
              print(f"| `{s['cmd']}` | {s['programs']:,} | {s['points']:,} | {s['missed']} | {s['crashed']} | {s['seconds']} |")
          print(f"\nWall time {d['wall_s']} s.")
          EOF

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-protocols-${{ matrix.job }}
          path: results/
          retention-days: 30

  # The metamorphic checks on every golden case (ci.yml: every 40th, --quick), in 2 shards.
  metamorphic:
    name: metamorphic ${{ matrix.shard }}/2
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-dependency-glob: .python-version

      - uses: actions/download-artifact@v8
        with:
          name: bench-rowan
          path: bin

      - run: chmod +x bin/rowan

      - name: Metamorphic checks, the shard's cases
        run: |
          mkdir -p results
          ROWAN_BIN="$PWD/bin/rowan" uv run --no-project python tests/metamorphic.py --shard ${{ matrix.shard }}/2 -j 4 \
            --json results/metamorphic-${{ matrix.shard }}.json | tee results/metamorphic-${{ matrix.shard }}.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo "### metamorphic checks, shard ${{ matrix.shard }}/2 (tests/metamorphic.py)"
            echo
            echo '```'
            tail -6 results/metamorphic-${{ matrix.shard }}.txt 2>/dev/null || echo "no result"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-metamorphic-${{ matrix.shard }}
          path: results/
          retention-days: 30

  # The bounded proofs of the tries' bit arithmetic (rowan/src/laws/kani_tries.rs).
  kani:
    name: kani
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/kani
            ~/.cargo/bin/cargo-kani
            ~/.kani
          key: kani-${{ runner.os }}-0.68.0

      - name: Install Kani
        run: |
          command -v cargo-kani || cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup

      - name: cargo kani --lib
        working-directory: rowan
        run: |
          mkdir -p ../results
          start=$(date +%s)
          set +e
          cargo kani --lib 2>&1 | tee ../results/kani.txt
          rc=${PIPESTATUS[0]}
          set -e
          secs=$(( $(date +%s) - start ))
          ok=$(grep -c "VERIFICATION:- SUCCESSFUL" ../results/kani.txt || true)
          bad=$(grep -c "VERIFICATION:- FAILED" ../results/kani.txt || true)
          echo "{\"harnesses\": $((ok + bad)), \"failed\": $bad, \"seconds\": $secs, \"rc\": $rc}" > ../results/kani.json
          {
            echo "### Kani (cargo kani --lib)"
            echo
            echo "$((ok + bad)) harnesses, $bad failed, ${secs} s (exit $rc)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-kani
          path: results/
          retention-days: 30

  # What following installed packages costs and buys (bench/sitepackages.py: five pinned venvs,
  # `--follow` off / '*' / the company package alone; not the uncapped mode, which runs for
  # minutes). The venvs are cached by their pins and the local package.
  sitepackages:
    name: site-packages ${{ matrix.set }}
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { set: capped, args: "", out: sitepackages }
          # every bound off (each run cut at --uncapped-timeout, 120 s)
          - { set: uncapped, args: "--modes none,uncapped,unbounded --no-check", out: sitepackages-uncapped }
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-dependency-glob: .python-version

      - uses: actions/download-artifact@v8
        with:
          name: bench-rowan
          path: bin

      - run: chmod +x bin/rowan

      - uses: actions/cache@v4
        with:
          path: bench/work/sitepackages
          key: sitepackages-${{ runner.os }}-${{ hashFiles('bench/sitepackages.py', 'bench/sitepackages/**', '.python-version') }}

      - name: Site-packages benchmark
        run: |
          mkdir -p results
          {
            echo "### site-packages, ${{ matrix.set }} (bench/sitepackages.py ${{ matrix.args }})"
            echo
            uv run --no-project python bench/sitepackages.py --rowan bin/rowan ${{ matrix.args }} --out results/${{ matrix.out }}.json
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-${{ matrix.out }}
          path: results/
          retention-days: 30

  # The held-out corpus (bench/heldout.py metrics, default limits: the 10 s deadline; 31 pinned
  # packages no iteration tunes against, their sdists cached): proven %, known hover facts %,
  # time, memory, cut runs. The tuned-on side, measured the same way, is the tracked job's.
  heldout:
    name: held-out corpus
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-dependency-glob: .python-version

      - uses: actions/download-artifact@v8
        with:
          name: bench-rowan
          path: bin

      - run: chmod +x bin/rowan

      - uses: actions/cache@v4
        with:
          path: bench/work/heldout/src
          key: heldout-src-${{ hashFiles('bench/heldout/manifest.json') }}

      - name: Held-out corpus, default limits
        run: |
          mkdir -p results
          uv run --no-project python bench/heldout.py fetch
          uv run --no-project python bench/heldout.py metrics --mode default --rowan bin/rowan --json results/heldout.json | tee results/heldout.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo "### held-out corpus (bench/heldout.py metrics --mode default)"
            echo
            echo '```'
            cat results/heldout.txt 2>/dev/null || echo "no result"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          # (not `bench-*`: history.py reads those)
          name: heldout-metrics
          path: results/
          retention-days: 30

  # Soundness without per-call-site runs: the golden suites with `tab=0` (main before the
  # summaries were removed: every call used its function's summary) and `budget=0` (every call
  # past its function's budget: an unknown call, and a reporting run with open parameters).
  # Informational: the step never fails the job.
  golden-fallback:
    name: golden (tab=0 / budget=0)
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-dependency-glob: .python-version

      - uses: actions/download-artifact@v8
        with:
          name: bench-rowan
          path: rowan/target/release

      - name: Golden suites, every call past its budget
        continue-on-error: true
        run: |
          chmod +x rowan/target/release/rowan
          mkdir -p results
          ROWAN_LIMITS=budget=0 uv run --no-project python tests/run_golden.py > golden.txt 2>&1 || true
          line=$(grep -E '^ *[0-9]+/[0-9]+ passed' golden.txt | tail -1)
          pass=$(echo "$line" | sed -E 's|^ *([0-9]+)/([0-9]+).*|\1|')
          total=$(echo "$line" | sed -E 's|^ *([0-9]+)/([0-9]+).*|\2|')
          echo "{\"name\": \"golden tab=0\", \"golden_passing\": ${pass:-0}, \"golden_failing\": $(( ${total:-0} - ${pass:-0} ))}" > results/golden-tab0.json
          {
            echo "### golden suites with ROWAN_LIMITS=budget=0 (informational)"
            echo
            echo "${line:-no result}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-golden
          path: results/
          retention-days: 30

  summary:
    name: summary
    needs: [tracked, hovers, protocols, metamorphic, kani]
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-dependency-glob: .python-version

      - uses: actions/download-artifact@v8
        with:
          pattern: bench-*
          path: results
          merge-multiple: true

      - name: One table for everything
        run: |
          uv run --no-project python - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, subprocess, sys
          from pathlib import Path
          r = Path("results")
          tr = sorted(str(f) for f in r.glob("tracked-*.json"))
          print("## The tracked set (bench/tracked.py: the eight + the cost set; 10 s deadline and none)\n")
          if tr:
              print(subprocess.run([sys.executable, "bench/tracked.py", "table", *tr, "--md"], capture_output=True, text=True).stdout)
              print(f"{len(tr)} of 4 shards. Wall time and memory vary 10–20% between runners; work counters are deterministic. Profiles: the tracked jobs' summaries; flamegraphs: the bench-tracked-* artifacts.\n")
          else:
              print("no result\n")
          print("## Hovers (bench/hovers.py, bench/first_hover.py)\n")
          print("| program | functions | setup | p50 | p99 | max | cut | first hover p50 | first hover max | serve peak memory |")
          print("| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |")
          for p in ["stdlib12k", "email", "rich", "click", "pip", "timm", "sktime", "functional"]:
              h = json.loads((r / f"{p}-hovers.json").read_text())["summary"] if (r / f"{p}-hovers.json").exists() else {}
              f = json.loads((r / f"{p}-first.json").read_text())["summary"] if (r / f"{p}-first.json").exists() else {}
              fh = f.get("first_hover_ms", {})
              print(f"| {p} | {h.get('timed', '–')} | {h.get('setup_ms', '–')} ms | {h.get('p50', '–')} ms | {h.get('p99', '–')} ms | {h.get('max', '–')} ms | {h.get('cut', '–')} | {fh.get('p50', '–')} ms | {fh.get('max', '–')} ms | {f.get('peak_mb', '–')} MB |")
          print("\n## Protocol enumerators in full (bench/protocols.py full)\n")
          by, jobs = {}, 0
          for f in sorted(r.glob("protocols-*.json")):
              jobs += 1
              for n, t in json.loads(f.read_text())["by_name"].items():
                  b = by.setdefault(n, {"programs": 0, "points": 0, "missed": 0, "crashed": 0, "seconds": 0.0})
                  for k in b:
                      b[k] += t[k]
          print("| enumerator | programs (× limit sets) | points | missed | crashed batches | seconds (summed over shards) |")
          print("| --- | --- | --- | --- | --- | --- |")
          for n, b in sorted(by.items()):
              print(f"| {n} | {b['programs']:,} | {b['points']:,} | {b['missed']} | {b['crashed']} | {b['seconds']:.0f} |")
          print(f"\n{jobs} of 4 jobs.\n")
          print("## Metamorphic checks in full (tests/metamorphic.py)\n")
          ms = [json.loads(f.read_text()) for f in sorted(r.glob("metamorphic-*.json"))]
          if ms:
              checks = ms[0]["checked"].keys()
              print("| check | places | missed | cases missed |")
              print("| --- | --- | --- | --- |")
              for k in checks:
                  print(f"| {k} | {sum(m['checked'][k] for m in ms)} | {sum(m['missed'][k] for m in ms)} | {sum(m['cases_missed'][k] for m in ms)} |")
              print(f"\n{sum(m['cases'] for m in ms)} cases in {len(ms)} of 2 shards.\n")
          else:
              print("no result\n")
          k = r / "kani.json"
          print("## Kani\n")
          print(json.loads(k.read_text()) if k.exists() else "no result")
          EOF

  # History across commits (main only): github-action-benchmark appends this run's numbers to
  # the data on the `gh-pages` branch (dev/bench/data.js, charts in dev/bench/index.html), and
  # the branch's contents are deployed to GitHub Pages (Settings → Pages → Source: GitHub
  # Actions): https://kaidaniel.github.io/rowan/dev/bench/
  history:
    name: history
    needs: [tracked, golden-fallback, hovers, sitepackages, protocols, metamorphic, kani]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    concurrency:
      # one writer of gh-pages at a time
      group: bench-history
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-dependency-glob: .python-version

      - uses: actions/download-artifact@v8
        with:
          pattern: bench-*
          path: results
          merge-multiple: true

      - name: Results as benchmark entries
        run: uv run --no-project python bench/history.py results bench-history.json

      - name: Append to the history on gh-pages
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: rowan
          tool: customSmallerIsBetter
          output-file-path: bench-history.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # informational: a regression shows in the charts and the job log, nothing fails
          alert-threshold: "130%"
          comment-on-alert: false
          fail-on-alert: false

      - name: The gh-pages contents
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: site

      - name: The overview page and the release scoreboard
        run: |
          cp site/dev/bench/index.html site/dev/bench/charts.html
          cp bench/site/index.html site/dev/bench/index.html
          cp bench/scoreboard.json site/dev/bench/scoreboard.json

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: publish to GitHub Pages
    needs: history
    if: always() && needs.history.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}dev/bench/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
