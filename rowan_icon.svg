<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Navy Blue Circle Background -->
  <circle cx="200" cy="200" r="200" fill="#243c75" />

  <!-- Edges (White) -->
  <!-- Root to Left Leaf -->
  <line x1="170" y1="80" x2="90" y2="200" stroke="#ffffff" stroke-width="6"/>
  <!-- Root to Right Internal Node -->
  <line x1="170" y1="80" x2="250" y2="200" stroke="#ffffff" stroke-width="6"/>
  <!-- Right Internal Node to Left Leaf -->
  <line x1="250" y1="200" x2="190" y2="320" stroke="#ffffff" stroke-width="6"/>
  <!-- Right Internal Node to Right Leaf -->
  <line x1="250" y1="200" x2="310" y2="320" stroke="#ffffff" stroke-width="6"/>

  <!-- Internal Nodes (White outline, dark navy/black fill) -->
  <!-- Root Node -->
  <circle cx="170" cy="80" r="28" fill="#0f172a" stroke="#ffffff" stroke-width="6"/>
  <!-- Right Intermediate Node -->
  <circle cx="250" cy="200" r="28" fill="#0f172a" stroke="#ffffff" stroke-width="6"/>
  
  <!-- Leaf Nodes (Red Circles with white outline) -->
  <!-- Leftmost Leaf -->
  <circle cx="90" cy="200" r="28" fill="#ef4444" stroke="#ffffff" stroke-width="6"/>
  <!-- Middle Leaf (Right-Left) -->
  <circle cx="190" cy="320" r="28" fill="#ef4444" stroke="#ffffff" stroke-width="6"/>
  <!-- Rightmost Leaf (Right-Right) -->
  <circle cx="310" cy="320" r="28" fill="#ef4444" stroke="#ffffff" stroke-width="6"/>
</svg>
