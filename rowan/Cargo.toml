[package]
name = "rowan"
version = "0.1.0"
edition = "2021"
description = "rowan: an abstract interpreter for Python (values, failing accesses, input schemas)"

[[bin]]
name = "rowan"
path = "src/main.rs"

[lib]
name = "rowan"
path = "src/lib.rs"

[dependencies]
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.14.0" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.14.0" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", tag = "0.14.0" }
ruff_source_file = { git = "https://github.com/astral-sh/ruff", tag = "0.14.0" }
smallvec = "1"
mimalloc = { version = "0.1.43", default-features = false }
indexmap = "2"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
debug = 1
opt-level = 3

[profile.dev]
opt-level = 1
